- key: gcc
  title: 'GCC: A 3DGS Inference Architecture with Gaussian-Wise and Cross-Stage Conditional Processing'
  authors_html: <strong>Minnan Pei</strong>, Gang Li, Junwen Si, Zeyu Zhu, Zitao Mo, Peisong Wang, Zhuoran Song, Xiaoyao Liang,
    Jian Cheng
  authors:
  - Minnan Pei
  - Gang Li
  - Junwen Si
  - Zeyu Zhu
  - Zitao Mo
  - Peisong Wang
  - Zhuoran Song
  - Xiaoyao Liang
  - Jian Cheng
  venue: MICRO
  year: 2025
  topic: 3DGS
  tags:
  - 3D Gaussian Splatting
  - Computer architecture
  - Conditional processing
  summary:
    en: GCC accelerates novel view synthesis from a reconstructed 3D scene by skipping unused Gaussians and reusing each Gaussian across image tiles.
    zh: 三维重建得到高斯场景后，GCC 在渲染新视角时跳过用不到的高斯，并在图像分块间复用高斯数据，减少端侧计算与访存。
  detail:
    en: GCC uses cross-stage conditional processing to skip preprocessing for primitives that never affect the image. Its Gaussian-wise rendering dataflow finishes the contributions of one Gaussian before loading the next. The paper compares the speed and energy efficiency of this 3D Gaussian Splatting (3DGS) accelerator with GSCore.
    zh: GCC 面向端侧低功耗的新视角合成。跨阶段条件处理让三维高斯溅射（3DGS）加速器跳过无用的预处理，逐高斯渲染则减少重复读取。论文将这一硬件设计与 GSCore 比较，评估渲染性能与能效。
  arxiv: '2507.15300'
  doi: 10.1145/3725843.3756072
  resources:
  - label: PDF
    url: https://arxiv.org/pdf/2507.15300
  equal: false
- key: degs
  title: 'DeGS: A Scalable 3DGS Architecture via Decoupled Workload Parsing and Reorganization'
  authors_html: <strong>Minnan Pei</strong>, Gang Li, Zeyu Zhu, Siting Wang, Junwen Si, Zhuoran Song, Yu Feng, Fangxin Liu,
    Xiaoyao Liang and Jian Cheng
  authors:
  - Minnan Pei
  - Gang Li
  - Zeyu Zhu
  - Siting Wang
  - Junwen Si
  - Zhuoran Song
  - Yu Feng
  - Fangxin Liu
  - Xiaoyao Liang
  - Jian Cheng
  venue: MICRO
  year: 2026
  topic: 3DGS
  tags:
  - 3D Gaussian Splatting
  - Computer architecture
  - Scalability
  summary:
    en: DeGS speeds up high-resolution Gaussian rendering by grouping useful pixel work before blending, so more processing elements can run in parallel.
    zh: 高分辨率新视角渲染时，增加处理单元并不总能提速。DeGS 在像素混合前重组有效工作，提高三维高斯溅射加速器的并行利用率。
  detail:
    en: In 3D Gaussian Splatting (3DGS), irregular footprints and early pixel termination leave parallel processing elements idle. DeGS decouples workload parsing from blending and uses workload reorganization to pack the surviving pixel operations together. The paper measures scaling from 16 to 1,024 processing elements, at resolutions from 720p to 8K.
    zh: 对三维重建后的高斯场景合成新视角时，高斯覆盖的区域不规则，每个像素结束混合的时刻也不同。DeGS 将覆盖和透射率检查与混合分开，评估了 16 至 1,024 个处理单元以及 720p 至 8K 分辨率下的扩展性。
  arxiv: '2608.02099'
  resources:
  - label: PDF
    url: https://arxiv.org/pdf/2608.02099
  equal: false
