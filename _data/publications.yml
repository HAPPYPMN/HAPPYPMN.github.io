- key: splats-to-silicon
  title: 'From Splats to Silicon: Rethinking Computational Efficiency of 3DGS'
  authors_html: <strong>Minnan Pei</strong>, Qiwei Dong, Yihan Zhou, Gang Li, Yuchen Zhu, Wenju Zhao, Zhongtian Long, Siting
    Wang, Peisong Wang and Jian Cheng
  authors:
  - Minnan Pei
  - Qiwei Dong
  - Yihan Zhou
  - Gang Li
  - Yuchen Zhu
  - Wenju Zhao
  - Zhongtian Long
  - Siting Wang
  - Peisong Wang
  - Jian Cheng
  venue: arXiv
  year: 2026
  topic: 3DGS
  tags:
  - 3D Gaussian Splatting
  - Hardware efficiency
  - Profiling
  summary:
    en: From Splats to Silicon uses GPU profiling to trace when reducing work in 3D Gaussian Splatting actually saves memory traffic or shortens frame time.
    zh: 三维高斯溅射的计算量减少后，渲染一帧会更快吗？这项研究结合文献和 GPU 性能分析，追踪各阶段的工作量、访存量与耗时。
  detail:
    en: Rendering new views of a reconstructed scene involves selecting Gaussians, processing their screen-space footprints and moving data between stages. The study compares how those costs change across scenes, viewpoints and implementations. Its companion tool, gsprof, supports investigation of GPU bottlenecks.
    zh: 对三维重建后的场景做新视角合成时，同一种优化在不同场景和视角下可能得到不同的帧耗时。论文把高斯筛选、屏幕空间工作量与下游执行联系起来，配套的 gsprof 可用于定位 GPU 瓶颈。
  arxiv: '2609.06157'
  resources:
  - label: PDF
    url: https://arxiv.org/pdf/2609.06157
  - label: Code
    url: https://github.com/HAPPYPMN/gsprof
  equal: false
